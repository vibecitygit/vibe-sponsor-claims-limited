<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cut-out wall harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Bangers&family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;700;800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Permanent+Marker&family=Rubik+Mono+One&family=Special+Elite&display=swap">
<style>body { margin: 0; } #spacer { display: block; }</style>
</head>
<body>
<!-- Query: ?theme=light|dark  &cards=white|dark  &top=<px spacer above the wall>  &bottom=<px spacer below it>  &now=<ms>  &live=1 (adds a live-style coupon) -->
<div id="spacer"></div>
<div id="host"></div>
<div id="after"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="../assets/sponsor-wall/deck-core.js"></script>
<script src="../assets/sponsor-wall/wall-cutouts.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), D = window.DeckCore, R = window.VCWallRenderers.cutouts;
  const theme = q.get('theme') === 'light' ? 'light' : 'dark';
  document.body.style.background = theme === 'light' ? '#f3f1ec' : '#0b0b0b';
  document.getElementById('spacer').style.height = (+q.get('top') || 0) + 'px';
  document.getElementById('after').style.height = (+q.get('bottom') || 0) + 'px';
  // the prototype's deck: DeckCore.load() with no stored data is normalize(null); a stored { wall } only changes wall
  const base = D.sample();
  const deck = { count: base.count, coupons: base.coupons, wall: D.wallOf({ theme, cards: q.get('cards') || undefined }) };
  // SAMPLE paths start with shared/...; this folder holds copies at sponsors/ and photos/
  deck.coupons.forEach(c => {
    if (c.logoSrc) c.logoSrc = c.logoSrc.replace(/^shared\//, '');
    c.photos = (c.photos || []).map(p => p.replace(/^shared\//, ''));
  });
  if (q.get('live')) {
    // a live coupon: no stock data, no end date
    const c = deck.coupons[7];
    delete c.remaining; delete c.total; c.limited = false; c.from = ''; c.to = ''; c.year = '';
    const d = deck.coupons[0]; delete d.remaining; delete d.total; // tier-1 limited, but no stock data
    c.where = ''; // an offer with an empty field: that row is hidden
    // sponsors without a published offer: one with a site, one without
    const blank = o => Object.assign(o, { noOffer: true, short: '', long: '', where: '', limit: '', terms: [], from: '', to: '', year: '', type: '', limited: false });
    blank(deck.coupons[6]); delete deck.coupons[6].remaining; delete deck.coupons[6].total;
    blank(deck.coupons[5]); deck.coupons[5].site = ''; delete deck.coupons[5].remaining; delete deck.coupons[5].total;
    blank(deck.coupons[3]); delete deck.coupons[3].remaining; delete deck.coupons[3].total; // a voucher-sized one
  }
  const host = document.getElementById('host'), root = host.attachShadow({ mode: 'open' });
  const style = document.createElement('style'); style.textContent = R.css; root.appendChild(style);
  const container = document.createElement('div'); root.appendChild(container);
  window.__claims = [];
  const now = q.get('now') ? +q.get('now') : undefined;
  window.__wall = R.mount(container, deck, { root, now, onClaim: id => window.__claims.push(id) });
// The prototype page painted the wall's page colour itself; the port leaves that to the host page, so this test page paints it.
{ const paint = () => { const w = container.querySelector('.cw'); if (w) document.body.style.background = getComputedStyle(w).getPropertyValue('--bg').trim(); }; paint(); new MutationObserver(paint).observe(container, { subtree: true, childList: true, attributes: true }); }
  window.__root = root;
})();
</script>
</body>
</html>
