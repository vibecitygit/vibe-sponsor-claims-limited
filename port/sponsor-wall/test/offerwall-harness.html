<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offer wall harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>html, body { margin: 0; }</style>
</head>
<body>
<!-- Query: ?format=featured|cascade&cards=dark|white&theme=dark|light&now=<ms>&rotation=<n>&top=<px>
     `top` only offsets the wall on the page (the prototype's section heading sits above its wall), so both
     pages put the cards at the same place in the viewport. -->
<div id="host"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../assets/sponsor-wall/deck-core.js"></script>
<script src="../assets/sponsor-wall/wall-offerwall.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const format = q.get('format') === 'cascade' ? 'cascade' : 'featured';
  // The deck as the prototype builds it: DeckCore.load() is normalize(stored), and with no stored coupons that is
  // the SAMPLE through normalize (= DeckCore.sample()) plus the wall settings the prototype's options store.
  const deck = DeckCore.sample();
  deck.wall = DeckCore.wallOf({ v: 2, layout: format, theme: q.get('theme') === 'light' ? 'light' : 'dark', cards: q.get('cards') === 'white' ? 'white' : 'dark' });
  // SAMPLE paths are relative to the prototype at the repo root (shared/...); the same files are copied next to this page.
  deck.coupons.forEach(c => {
    if (c.logoSrc) c.logoSrc = c.logoSrc.replace(/^shared\//, '');
    c.photos = c.photos.map(p => p.replace(/^shared\//, ''));
  });
  const host = document.getElementById('host');
  if (q.get('top')) host.style.paddingTop = (+q.get('top')) + 'px';
  const root = host.attachShadow({ mode: 'open' });
  const container = document.createElement('div');
  root.appendChild(container);
  window.__claims = [];
  window.__wall = VCWallRenderers[format].mount(container, deck, {
    root,
    now: q.has('now') ? +q.get('now') : undefined,
    rotation: q.has('rotation') ? +q.get('rotation') : undefined,
    onClaim: id => window.__claims.push(id),
  });
  window.__deck = deck;
})();
</script>
</body>
</html>
