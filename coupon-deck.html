<title>Sponsor Drops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/coupon.css">
<style>
/* Layout: one full-bleed WebGL scene (invisible table, fogged horizon); DOM overlay for the presented coupon.
   Tokens come from shared/tokens.css, coupon face styles from shared/coupon.css. */
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--fg);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
/* Embed mode (index.html#embed): the deck as a block inside another page — no header, hint or
   wallet, transparent ground; the host page sets spacing and receives the height it needs. */
html.embed body { background: transparent; }
html.embed .topbar, html.embed .hint, html.embed .wallet-panel { display: none !important; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#scene.pointer { cursor: pointer; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- Chrome ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  padding-bottom: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.brandmark { display: grid; gap: 4px; min-width: 0; }
.brandmark h1 {
  margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(30px, 4vw, 44px);
  letter-spacing: 0; line-height: 0.9; text-transform: uppercase;
}
.brandmark h1 em { font-style: normal; color: var(--ember); }
.brandmark .mark { font: 800 16px/1 var(--font-display); letter-spacing: 0; text-transform: uppercase; color: var(--fg);
}
.brandmark p {
  margin: 0; font: 700 11px/1.25 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.wallet-btn {
  pointer-events: auto; position: relative;
  display: inline-flex; align-items: center; gap: 10px;
  height: 33px; padding: 0 18px; border-radius: 100px;
  background: transparent; border: 1px solid color-mix(in srgb, var(--fg) 48%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--fg); font: 700 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  transition: background-color .2s var(--ease), border-color .2s var(--ease);
}
.wallet-btn:hover { border-color: var(--fg); }
.wallet-btn[aria-expanded="true"] { background: var(--ember); border-color: var(--ember); color: var(--on-brand); }
.wallet-btn:focus-visible, button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.glyph { font: 400 13px/1 var(--font-body); letter-spacing: 0; }
.wallet-btn svg { width: 18px; height: 18px; }
.wallet-count {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 100px; display: grid; place-items: center;
  background: var(--ember); color: var(--on-brand); font: 800 11px/1 var(--font-body); font-variant-numeric: tabular-nums;
}
.linked-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: none; }
.wallet-btn.linked .linked-dot { display: block; }

.wallet-panel {
  position: fixed; z-index: 40; width: min(320px, calc(100vw - 32px));
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--raised); border: 1px solid var(--line-strong); border-radius: 12px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 20px; display: grid; gap: 12px; box-shadow: var(--shadow-modal);
}
.wallet-panel[hidden] { display: none; }
.wallet-panel h2 { margin: 0; font: 900 24px/1 var(--font-display); text-transform: uppercase; }
.wallet-panel .empty { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.wallet-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 50vh; overflow: auto; }
.wallet-list li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 0; background: var(--warm); border: 1px solid var(--line-strong); }
.wallet-list img { width: 36px; height: 36px; object-fit: contain; }
.wallet-list strong { display: block; font-size: 13px; }
.wallet-list strong { font: 800 16px/1 var(--font-display); text-transform: uppercase; }
.wallet-list span { font: 400 10px/1.4 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.hint {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; text-align: center; pointer-events: none;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font: 700 11px/1.25 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  transition: opacity .4s;
}

.hover-label {
  position: fixed; z-index: 25; left: 0; top: 0; pointer-events: none;
  transform: translate(-50%, -100%); opacity: 0; transition: opacity .18s;
  padding: 10px 14px; border-radius: 0; white-space: nowrap;
  background: var(--raised); border: 1px solid var(--line-strong);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.hover-label.on { opacity: 1; }
.hover-label strong { display: block; font: 800 18px/1 var(--font-display); text-transform: uppercase; }
.hover-label em { display: block; margin: 4px 0 6px; font: 500 13px/1.3 var(--font-body); font-style: normal; color: var(--fg-soft); white-space: normal; max-width: 240px; }
.hover-label span { font: 400 10px/1.4 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* ---------- Presentation stage ---------- */
#backdrop {
  position: fixed; inset: 0; z-index: 50; opacity: 0; pointer-events: none;
  background: rgba(11, 11, 11, 0.72);
  backdrop-filter: blur(7px) saturate(0.8); -webkit-backdrop-filter: blur(7px) saturate(0.8);
}
#backdrop.open { pointer-events: auto; }
#stage {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
  visibility: hidden; pointer-events: none;
}
#stage.open { visibility: visible; }
#stage.open .card { pointer-events: auto; }

.card {
  --u: 3.2px;
  position: relative; width: 320px; height: 512px;
  perspective: 1800px; opacity: 0;
}
.flipper { position: absolute; inset: 0; transform-style: preserve-3d; }
/* Above-card pill + close */
.pill-row {
  position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
}
.remain {
  display: inline-flex; align-items: center; gap: 10px;
  height: 36px; padding: 0 16px; border-radius: 100px;
  background: var(--raised); border: 1px solid var(--line-strong); color: var(--fg);
  font: 700 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; font-variant-numeric: tabular-nums;
  animation: bob 3.2s ease-in-out infinite;
}
.remain b { font: 900 22px/1 var(--font-display); color: var(--ember); }
.meter { width: 54px; height: 4px; border-radius: 0; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ember); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.xbtn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: var(--raised); border: 1px solid var(--line-strong); color: var(--fg); font: 400 20px/1 var(--font-body);
}
.xbtn:hover { border-color: var(--fg); }

/* QR state */
.qr-panel {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 2.2); padding-top: calc(var(--u) * 4);
}
.qr-panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: calc(var(--u) * 3.4); background: var(--brand); }
.qr-panel canvas { width: 58%; aspect-ratio: 1; max-width: 100%; image-rendering: pixelated; }
.qr-panel p { margin: 0; font: 900 calc(var(--u) * 7) / 1 var(--font-display); text-transform: uppercase; }
.qr-code { font: 700 calc(var(--u) * 3.1) / 1 var(--font-body); letter-spacing: 0.1em; color: var(--paper-muted); }
.after-actions {
  position: absolute; left: 50%; top: calc(100% + 18px); transform: translateX(-50%);
  display: none; gap: 10px; white-space: nowrap;
}
.after-actions .btn { --u: 3.3px; }
.btn-link { background: var(--ember); border-color: var(--ember); color: var(--on-brand); }
.btn-link:hover:not([disabled]) { box-shadow: var(--shadow-lift); }
.btn-done { background: transparent; color: var(--fg); border-color: color-mix(in srgb, var(--fg) 48%, transparent); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* Back / terms */
.back { transform: rotateY(180deg); display: flex; flex-direction: column; }
.back-band { height: 4px; background: var(--ember); flex: none; }
.back-body {
  flex: 1; overflow: auto; padding: 22px 24px 8px; display: grid; gap: 18px; align-content: start;
  overscroll-behavior: contain;
}
.back-head { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; }
.back-head img { width: 52px; height: 52px; object-fit: contain; }
.back-head h3 { margin: 0; font: 900 30px/1 var(--font-display); text-transform: uppercase; text-wrap: balance; }
.back-head span { font: 700 12px/1.25 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-ink-paper); }
.back-long { margin: 0; font-size: 16px; line-height: 1.4; max-width: 62ch; color: var(--ink-soft); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
.facts div { padding: 12px; border-radius: 0; background: var(--paper-raised); border: 1px solid var(--paper-line); min-width: 0; }
.facts dt { font: 700 10px/1.25 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-muted); }
.facts dd { margin: 4px 0 0; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.back h4 { margin: 0 0 10px; font: 800 18px/1 var(--font-display); text-transform: uppercase; color: var(--ink); }
.back ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14px; line-height: 1.4; color: var(--ink-soft); }
.fine { margin: 0; font: 400 10px/1.4 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-muted); }
.back-foot {
  flex: none; display: flex; gap: 10px; padding: 14px 24px 18px; border-top: 1px dashed var(--paper-line);
}
.back-foot .btn { --u: 3.4px; }
.back.wide .back-body { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); column-gap: 36px; padding: 30px 36px 10px; }
.back.wide .back-head, .back.wide .back-long { grid-column: 1; }
.back.wide .facts { grid-column: 1; }
.back.wide .terms-block { grid-column: 2; grid-row: 1 / span 3; }
.back.wide .fine { grid-column: 1 / -1; }
.back.wide .back-foot { padding: 16px 36px 22px; }

.toast {
  position: fixed; left: 50%; z-index: 70; bottom: calc(env(safe-area-inset-bottom, 0px) + 54px);
  transform: translateX(-50%); padding: 11px 18px; border-radius: 100px; opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--ink); font: 700 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}

.top-actions { display: flex; gap: 8px; pointer-events: auto; }
a.wallet-btn { text-decoration: none; }
@media (max-width: 719px) { .wallet-btn .wl { display: none; } }
@media (max-width: 520px) {
  .hint { font-size: 11px; }
  .brandmark p { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .remain { animation: none; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="shared/deck-core.js"></script>
<script>
(() => {
'use strict';


/* ================= Helpers ================= */
const { SHAPES, TYPES, EDIT_KEYS, mulberry32, hashStr, drawLogo, drawFace, drawUploadedLogo, loadImg, serialOf } = DeckCore;
const SAVED = DeckCore.load();
const COUPONS = SAVED.coupons;
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMBED = location.hash === '#embed';
if (EMBED) document.documentElement.classList.add('embed');
/* Spacing the host page sends: columns (0 = auto: 3 narrow, 5 wide), card width and gap in CSS px. */
const embedCfg = { cols: 0, cardPx: 150, gapPx: 50, fill: 1 };
const PULSE_AMP = reduced ? 0 : 0.012;
function mix(hexA, hexB, t) { const a = new THREE.Color(hexA), b = new THREE.Color(hexB); return a.lerp(b, t); }

function radialTex(inner = 'rgba(255,255,255,1)') {
  const S = 128, cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, inner); g.addColorStop(0.35, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S); return new THREE.CanvasTexture(cv);
}

function ringTex() {
  const S = 128, cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(S / 2, S / 2, S / 2 - 4, 0, Math.PI * 2); ctx.stroke();
  return new THREE.CanvasTexture(cv);
}
function shadowTex() {
  const W = 128, H = 192, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  ctx.filter = 'blur(9px)'; ctx.fillStyle = 'rgba(0,0,0,1)'; ctx.fillRect(22, 22, W - 44, H - 44);
  return new THREE.CanvasTexture(cv);
}

/* ================= Three.js scene ================= */
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: EMBED, powerPreference: 'high-performance' });
if (EMBED) renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const SKY_MID = new THREE.Color('#24211f'), SKY_GLOW = new THREE.Color('#ff4937');
const FOG_COL = SKY_MID.clone().add(SKY_GLOW.clone().multiplyScalar(0.12));
scene.fog = new THREE.Fog(FOG_COL, 15, 50);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);

const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#0b0b0b') }, mid: { value: SKY_MID }, bot: { value: new THREE.Color('#121110') }, glow: { value: SKY_GLOW } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 glow; varying vec3 vW;
    void main(){ vec3 d = normalize(vW - cameraPosition); float y = d.y;
      vec3 c = y > 0.0 ? mix(mid, top, pow(smoothstep(0.0, 0.5, y), 0.75)) : mix(mid, bot, smoothstep(0.0, 0.3, -y));
      c += glow * exp(-abs(y) * 26.0) * 0.12; gl_FragColor = vec4(c, 1.0); }`
}));
sky.renderOrder = -1; scene.add(sky);
if (EMBED) sky.visible = false;

scene.add(new THREE.HemisphereLight(0xb9b2f0, 0x2a2040, 0.42));

const CW = 1, CH = 1.6, T = 0.024, STEP = 0.034;
const cardGeo = new THREE.BoxGeometry(CW, T, CH);
const ripTex = ringTex(), shTex = shadowTex();
const QX90 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
const AX_Y = new THREE.Vector3(0, 1, 0);

const stacks = [];
const hitMat = new THREE.MeshBasicMaterial({ visible: false });

function stackSize(c) { return c.remaining <= 0 ? 1 : clamp(Math.round(c.remaining / 4), 2, 15); }
function makeArt(c) {
  c.serial = serialOf(c);
  c.logoCanvas = c._img ? drawUploadedLogo(c._img) : drawLogo(c); c.logoURL = c.logoCanvas.toDataURL();
  c.faceCanvas = drawFace(c, c.serial); c.faceURL = c.faceCanvas.toDataURL('image/jpeg', 0.9);
  c.tableCanvas = drawFace(c, c.serial, true); // table cards also preview the offer
  if (c.plainTex) { c.plainTex.dispose(); c.plainTex = null; }
}
function refreshStackArt(s) {
  makeArt(s.c);
  s.faceMat.map.image = s.c.tableCanvas; s.faceMat.map.needsUpdate = true;
  s.logo.material.map.dispose(); s.logo.material.map = new THREE.CanvasTexture(s.c.logoCanvas); s.logo.material.needsUpdate = true;
  s.edgeABase.copy(mix('#ebe7df', s.c.color, 0.4)); s.ripple.material.color.set(s.c.color);
}
function buildStacks() {
  COUPONS.forEach((c, i) => {
    makeArt(c);
    const faceTex = new THREE.CanvasTexture(c.tableCanvas); faceTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const faceMat = new THREE.MeshBasicMaterial({ map: faceTex });
    const edgeA = new THREE.MeshBasicMaterial({ color: mix('#ebe7df', c.color, 0.4) });
    const edgeB = new THREE.MeshBasicMaterial({ color: new THREE.Color('#d9d4ca') });
    const backMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#bdb5a8') });
    const matsA = [edgeA, edgeA, faceMat, backMat, edgeA, edgeA];

    .fromTo($('clogo'), { opacity: 0, scale: 0.2, rotation: -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: 'back.out(2.2)' }, '+=0.05')

    .fromTo('#cname .ch', { opacity: 0, yPercent: 90, rotationX: -85 }, { opacity: 1, yPercent: 0, rotationX: 0, duration: 0.55, stagger: 0.032, ease: 'power3.out' }, '-=0.45')
    .fromTo($('ceyebrow'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, '-=0.3')
    .set($('details'), { opacity: 1 }, '-=0.25')
    .add(typeOn($('cshort'), s.c.short, 0.7), '-=0.25')
    .fromTo('#details .ptype', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, '-=0.45')
    .fromTo('#details .year', { opacity: 0, y: 10, letterSpacing: '0.4em' }, { opacity: 1, y: 0, letterSpacing: '0.04em', duration: 0.6, ease: 'power3.out' }, '-=0.25')
    .fromTo('#details .valid', { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35 }, '-=0.35')
    .set($('actions'), { opacity: 1 }, '-=0.15')
    .fromTo('#actions .btn', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.08, ease: 'back.out(1.8)' }, '<')
    .fromTo(pillRow, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'back.out(2)' }, '-=0.35');
}

/* ---------- Close / return ---------- */
function closeCoupon() {
  if (state.busy) return;
  if (state.view === 'terms') return closeTerms();
  if (!['front', 'qr'].includes(state.view)) return;
  state.busy = true;
  const s = state.sel;
  const tl = gsap.timeline();
  tl.to([pillRow, afterActions], { opacity: 0, duration: 0.2 })
    .to(backdrop, { opacity: 0, duration: 0.5 }, '<');
  if (state.removeOnClose) {
    tl.to(cardEl, { opacity: 0, scale: 0.86, y: 40, duration: 0.4, ease: 'power2.in' }, '<')
      .add(() => finishRemoval());
    return;
  }
  if (state.view === 'qr') {
    tl.to(qrPanel, { opacity: 0, duration: 0.2 }, '<')
      .set(qrPanel, { display: 'none' })
      .to(cardEl, { width: state.W, height: state.H, duration: 0.45, ease: 'expo.inOut' })
      .to(artEl, { opacity: 1, duration: 0.3 }, '-=0.2');
  } else {
    tl.to(frontBits(), { opacity: 0, duration: 0.25, stagger: 0.03 }, '<');
  }
  tl.add(() => { fly.card.visible = true; })
    .to(cardEl, { opacity: 0, duration: 0.2, ease: 'none' })
    .add(() => { backdrop.classList.remove('open'); stage.classList.remove('open'); flyBack(); });
}
function flyBack() {
  const s = state.sel;
  state.view = 'flying';
  gsap.to(fly, { p: 0, duration: 1.05, ease: 'power3.inOut', onComplete: () => {
    fly.card.material = fly.mat; fly.card.renderOrder = 0;
    const p = layerPose(s, fly.layer, fly.card); fly.card.position.copy(p.pos); fly.card.quaternion.copy(p.quat);
    fly.card = null; endSelection();
  } });
  gsap.to(s, { hop: 0, duration: 0.6 });
}
function endSelection() {
  const s = state.sel;
  if (s.shownRemaining !== s.c.remaining) { refreshStackArt(s); s.shownRemaining = s.c.remaining; buildSrNav(); } // keep the table's "X of Y left" current after a claim
  gsap.to(s, { logoFade: 1, duration: 0.6 });
  gsap.fromTo(s, { appear: 0.3 }, { appear: 1, duration: 0.9, ease: 'elastic.out(1, 0.45)' });
  stacks.forEach(o => gsap.to(o, { dim: 1, duration: 0.6 }));
  state.sel = null; state.view = 'deck'; state.busy = false; state.removeOnClose = false;
  backdrop.classList.remove('open'); stage.classList.remove('open');
  $('hint').style.opacity = 1;
  flushPending();
}
function finishRemoval() {
  const s = state.sel;
  const card = fly.card;
  if (card) { scene.remove(card); const idx = s.cards.indexOf(card); if (idx >= 0) s.cards.splice(idx, 1); }
  fly.card = null;
  // keep at least one sold-out card on the table
  if (s.cards.length === 0) { const m = addCard(s); const p = layerPose(s, 0, m); m.position.copy(p.pos); m.quaternion.copy(p.quat); }
  gsap.to(s, { hop: 0, duration: 0.5 });
  resetDOM();
  endSelection();
}

/* ---------- Terms: flip + maximize ---------- */
function openTerms() {
  if (state.busy || state.view !== 'front') return;
  state.busy = true;
  const wide = innerWidth >= 720;
  const tw = wide ? Math.min(940, innerWidth - 80) : Math.min(innerWidth - 24, 520);
  const th = wide ? clamp(state.H, 460, innerHeight - 120) : innerHeight - 64;
  $('back').classList.toggle('wide', wide);
  $('backBody').scrollTop = 0;
  const kids = $('backBody').children;
  gsap.timeline({ onComplete: () => { state.busy = false; state.view = 'terms'; $('backBtn').focus({ preventScroll: true }); } })
    .to(pillRow, { opacity: 0, y: -12, duration: 0.25 })
    .to(flipper, { rotationY: 180, duration: 1.05, ease: 'power3.inOut' }, 0.05)
    .to(flipper, { z: 260, duration: 0.5, ease: 'power2.out' }, 0.05)
    .to(flipper, { z: 0, duration: 0.65, ease: 'power2.inOut' }, 0.55)
    .to(cardEl, { width: tw, height: th, duration: 0.8, ease: 'expo.inOut' }, 0.3)
    .fromTo(kids, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.06, ease: 'power2.out' }, 0.75);
}
function closeTerms(then) {
  if (state.busy || state.view !== 'terms') return;
  state.busy = true;
  gsap.timeline({ onComplete: () => { state.busy = false; state.view = 'front'; if (then) then(); else $('termsBtn').focus({ preventScroll: true }); } })
    .to(flipper, { rotationY: 0, duration: 0.95, ease: 'power3.inOut' }, 0)
    .to(flipper, { z: 220, duration: 0.45, ease: 'power2.out' }, 0)
    .to(flipper, { z: 0, duration: 0.6, ease: 'power2.inOut' }, 0.45)
    .to(cardEl, { width: state.W, height: state.H, duration: 0.75, ease: 'expo.inOut' }, 0.1)
    .to(pillRow, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, 0.8);
}

/* ---------- Claim: fade text, morph to square, reveal QR ---------- */
function buildQR(seed) {
  const N = 25, g = Array.from({ length: N }, () => Array(N).fill(0)), fixed = Array.from({ length: N }, () => Array(N).fill(false));
  const rng = mulberry32(seed);
  const finder = (r0, c0) => { for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) { const rr = r0 + r, cc = c0 + c; if (rr < 0 || cc < 0 || rr >= N || cc >= N) continue; const on = r >= 0 && r <= 6 && c >= 0 && c <= 6 && (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)); g[rr][cc] = on ? 1 : 0; fixed[rr][cc] = true; } };
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (let i = 8; i < N - 8; i++) { g[6][i] = g[i][6] = i % 2 === 0 ? 1 : 0; fixed[6][i] = fixed[i][6] = true; }
  const ar = N - 7; for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) { g[ar + r][ar + c] = (Math.max(Math.abs(r), Math.abs(c)) !== 1) ? 1 : 0; fixed[ar + r][ar + c] = true; }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!fixed[r][c]) g[r][c] = rng() < 0.48 ? 1 : 0;
  const cells = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (g[r][c]) cells.push({ r, c, k: fixed[r][c] ? -1 : Math.hypot(r - N / 2, c - N / 2) + rng() * 4 });
  cells.sort((a, b) => a.k - b.k);
  return { N, cells };
}
function animateQR(qr) {
  const cv = $('qr'), ctx = cv.getContext('2d'), S = cv.width, q = 2, m = S / (qr.N + q * 2);
  const o = { n: 0 };
  const draw = () => {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S); ctx.fillStyle = '#0b0b0b';
    const n = Math.round(o.n); for (let i = 0; i < n; i++) { const c = qr.cells[i]; ctx.fillRect(Math.floor((c.c + q) * m), Math.floor((c.r + q) * m), Math.ceil(m), Math.ceil(m)); }
  };
  draw();
  return gsap.to(o, { n: qr.cells.length, duration: 1.1, ease: 'power2.out', onUpdate: draw });
}
function claim() {
  if (state.busy) return;
  if (state.view === 'terms') return closeTerms(() => claim());
  if (state.view !== 'front') return;
  const s = state.sel, c = s.c;
  if (!c.claimed && c.remaining <= 0) return;
  state.busy = true;
  const first = !c.claimed;
  if (first) {
    c.claimed = true; c.code = `${c.id}-${Math.random().toString(36).slice(2, 6).toUpperCase()}-${String(Math.floor(rand(1000, 9999)))}`;
    state.removeOnClose = true;
  }
  $('qrCode').textContent = c.code;
  const S = Math.round(Math.min(state.W * 1.02, innerWidth - 32));
  const qr = buildQR(hashStr(c.code));
  syncAfterActions(c);
  const tl = gsap.timeline({ onComplete: () => { state.busy = false; state.view = 'qr'; syncClaimButtons(c); $('linkBtn').focus({ preventScroll: true }); } });
  tl.to(['#actions .btn', '#details > *', '#details .dates > *', '#clogo', '#cname .ch', '#ceyebrow'], { opacity: 0, y: -6, duration: 0.22, stagger: 0.02, ease: 'power1.in' })
    .to(artEl, { opacity: 0, duration: 0.35 }, '-=0.15')
    .to(cardEl, { width: S, height: S, duration: 0.7, ease: 'expo.inOut' }, '-=0.1')
    .set(qrPanel, { display: 'flex', opacity: 1 })
    .fromTo(qrPanel.children, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 })
    .add(animateQR(qr), '<')
    .set(afterActions, { display: 'flex' }, '-=0.4')
    .fromTo(afterActions, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, '<');
  if (first) {
    const o = { v: c.remaining };
    c.remaining -= 1;
    tl.to(o, { v: c.remaining, duration: 0.6, onUpdate: () => { $('remainNum').textContent = Math.round(o.v); } }, 0.6)
      .add(() => updateRemain(c), '>')
      .fromTo('.remain', { scale: 1.12 }, { scale: 1, duration: 0.6, ease: 'elastic.out(1, 0.4)' }, '<');
  }
}
function syncAfterActions(c) {
  const lb = $('linkBtn');
  lb.disabled = false;
  if (c.inWallet) { lb.textContent = 'Saved in wallet'; lb.disabled = true; }
  else lb.textContent = state.linked ? 'Add to wallet ↗' : 'Link account ↗';
}
function linkOrAdd() {
  if (state.busy || state.view !== 'qr') return;
  const c = state.sel.c; if (c.inWallet) return;
  const lb = $('linkBtn');
  if (state.linked) return addToWallet();
  state.busy = true; lb.disabled = true;
  lb.innerHTML = '<span class="spin" aria-hidden="true"></span>Linking…';
  gsap.delayedCall(reduced ? 0.4 : 1.1, () => {
    state.linked = true; $('walletBtn').classList.add('linked');
    lb.textContent = 'Account linked ✓';
    toast('Account linked');
    gsap.delayedCall(0.6, () => { state.busy = false; addToWallet(); });
  });
}
function addToWallet() {
  if (state.busy) return;
  state.busy = true;
  const s = state.sel, c = s.c;
  const wr = $('walletBtn').getBoundingClientRect(), cr = cardEl.getBoundingClientRect();
  const dx = (wr.left + wr.width / 2) - (cr.left + cr.width / 2), dy = (wr.top + wr.height / 2) - (cr.top + cr.height / 2);
  gsap.timeline()
    .to([afterActions, pillRow], { opacity: 0, duration: 0.2 })
    .to(cardEl, { x: dx, y: dy, scale: 0.06, rotation: -16, duration: 0.85, ease: 'power3.in' }, 0.1)
    .to(backdrop, { opacity: 0, duration: 0.6 }, 0.2)
    .to(cardEl, { opacity: 0, duration: 0.15 }, 0.8)
    .add(() => {
      c.inWallet = true; state.wallet.push(c); renderWallet();
      gsap.fromTo('#walletBtn', { scale: 1.22 }, { scale: 1, duration: 0.8, ease: 'elastic.out(1, 0.35)' });
      toast(`${c.brand} saved to your wallet`);
      if (state.removeOnClose) { state.busy = false; finishRemoval(); }
      else { resetDOM(); fly.card.visible = true; state.busy = false; backdrop.classList.remove('open'); stage.classList.remove('open'); flyBack(); }
    });
}
function renderWallet() {
  $('walletCount').textContent = state.wallet.length;
  $('walletEmpty').hidden = state.wallet.length > 0;
  const ul = $('walletList'); ul.innerHTML = '';
  state.wallet.forEach(c => {
    const li = document.createElement('li');
    li.innerHTML = '<img alt=""><div><strong></strong><span></span></div>';
    li.querySelector('img').src = c.logoURL; li.querySelector('strong').textContent = c.brand;
    li.querySelector('span').textContent = `${c.code} · valid to ${c.to}`;
    ul.appendChild(li);
  });
}
let toastTl;
function toast(msg) {
  const t = $('toast'); t.textContent = msg;
  if (toastTl) toastTl.kill();
  toastTl = gsap.timeline().fromTo(t, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }).to(t, { opacity: 0, duration: 0.4, delay: 1.8 });
}

/* ---------- Wire up controls ---------- */
$('closeBtn').addEventListener('click', closeCoupon);
$('claimBtn').addEventListener('click', claim);
$('backClaimBtn').addEventListener('click', claim);
$('termsBtn').addEventListener('click', openTerms);
$('backBtn').addEventListener('click', () => closeTerms());
$('linkBtn').addEventListener('click', linkOrAdd);
$('doneBtn').addEventListener('click', closeCoupon);
backdrop.addEventListener('click', closeCoupon);
stage.addEventListener('click', e => { if (e.target === stage) closeCoupon(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('walletPanel').hidden) toggleWallet(false); else closeCoupon(); }
});
function toggleWallet(force) {
  const p = $('walletPanel'); const open = force ?? p.hidden;
  p.hidden = !open; $('walletBtn').setAttribute('aria-expanded', String(open));
  if (open) gsap.fromTo(p, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.25 });
}
$('walletBtn').addEventListener('click', e => { e.stopPropagation(); toggleWallet(); });
document.addEventListener('pointerdown', e => { const p = $('walletPanel'); if (!p.hidden && !p.contains(e.target) && !$('walletBtn').contains(e.target)) toggleWallet(false); });

function buildSrNav() {
  const nav = $('srNav'); nav.innerHTML = '';
  stacks.filter(s => s.active).forEach(s => {
    const b = document.createElement('button');
    b.textContent = `Open ${s.c.brand}: ${s.c.short} ${s.c.remaining} of ${s.c.total} remaining.`;
    b.addEventListener('focus', () => { if (state.view === 'deck') setHover(s); });
    b.addEventListener('blur', () => setHover(null));
    b.addEventListener('click', () => select(s));
    nav.appendChild(b);
  });
}

/* ================= Deck data: live from the editor page ================= */
/* The editor (editor.html) writes the deck through DeckCore.save(); this page only reads.
   Edits arriving while a coupon is open or cards are moving wait until the table is idle. */
let pendingDeck = null;
function applyDeck(d) {
  if (!state.dealt || state.view !== 'deck' || state.busy) { pendingDeck = d; return; }
  pendingDeck = null;
  const changed = [];
  const loads = d.coupons.map((nc, i) => {
    const c = COUPONS[i]; if (!c) return null;
    const before = JSON.stringify(DeckCore.editable(c)), imgChanged = nc.logoImg !== c.logoImg;
    EDIT_KEYS.forEach(k => { c[k] = nc[k]; });
    if (JSON.stringify(DeckCore.editable(c)) !== before) changed.push(stacks[i]);
    return imgChanged ? loadImg(c) : null;
  });
  Promise.all(loads).then(() => {
    changed.forEach(s => { refreshStackArt(s); syncCards(s); });
    setCount(d.count);
    if (changed.length) { buildSrNav(); toast(changed.length === 1 ? `${changed[0].c.brand} updated` : 'Deck updated'); }
  });
}
function flushPending() { if (pendingDeck) applyDeck(pendingDeck); }
DeckCore.subscribe(applyDeck);

/* ================= Render loop ================= */
const clock = new THREE.Clock();
const camRight = new THREE.Vector3(), camUp = new THREE.Vector3(0, 1, 0);
const labelPos = new THREE.Vector3();
function frame() {
  const t = clock.getElapsedTime();
  // parallax (frozen while a coupon is up so the hand-off lines up)
  const live = state.view === 'deck' && !state.busy && !reduced && !EMBED;
  camRig.par.lerp(live ? camRig.parT : new THREE.Vector2(), live ? 0.04 : 0.12);
  const camDist = camRig.dist * state.zoom;
  camera.position.copy(camRig.target).addScaledVector(camRig.dir, camDist);
  if (EMBED) { scene.fog.near = 900; scene.fog.far = 1000; } else { scene.fog.near = camDist + 4; scene.fog.far = camDist + 40; }
  camRight.set(1, 0, 0);
  camera.position.addScaledVector(camRight, camRig.par.x * 0.8).addScaledVector(camUp, -camRig.par.y * 0.4);
  camera.lookAt(camRig.target); camera.updateMatrixWorld();
  if (Math.abs(state.shiftX) > 0.5 || Math.abs(state.shiftY) > 0.5) camera.setViewOffset(innerWidth, innerHeight, state.shiftX, state.shiftY, innerWidth, innerHeight);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
  sky.position.copy(camera.position);

  for (const s of stacks) {
    const bps = s.c.bpm / 60, beat = (t * bps + s.phase) % 1;
    let pulse = Math.exp(-beat * 5);
    if (s.c.dub) pulse += 0.5 * Math.exp(-(((beat - 0.24) + 1) % 1) * 9);
    const rip = (t * bps * 0.25 + s.phase) % 1;
    const lit = state.hovered === s;
    s.hoverV = lerp(s.hoverV, lit ? 1 : 0, 0.15);
    // settled cards follow their stack (lets the fan re-flow smoothly)
    for (let l = 0; l < s.cards.length; l++) { const card = s.cards[l]; if (card.userData.free || card === fly.card) continue; const p = layerPose(s, l, card); card.position.copy(p.pos); card.quaternion.copy(p.quat); }
    s.hit.position.set(s.x, 0.8, s.z); s.hit.rotation.y = s.rot;
    s.shadow.position.set(s.x + 0.07, 0.001, s.z + 0.12); s.shadow.rotation.set(-Math.PI / 2, s.rot, 0);
    s.topY = lerp(s.topY, s.base + s.cards.length * STEP, 0.08);
    const bob = Math.sin(t * 0.8 + s.phase * 6.28) * 0.035;
    const sold = s.c.remaining <= 0 ? 0.45 : 1;
    const sc = 0.5 * s.appear * (1 + PULSE_AMP * pulse + 0.18 * s.hoverV);
    const asp = s.c.logoCanvas.width / s.c.logoCanvas.height;
    if (asp >= 1) { const w = sc * Math.min(asp, 1.7); s.logo.scale.set(w, w / asp, 1); } else s.logo.scale.set(sc * asp, sc, 1);
    s.logo.position.set(s.x, s.topY + 0.62 + bob + s.hop + 0.12 * s.hoverV, s.z);
    const vis = clamp(s.logoFade * s.dim * sold, 0, 1);
    s.logo.material.opacity = vis;
    s.logo.material.rotation = Math.sin(t * 0.6 + s.phase * 5) * 0.025;
    s.ripple.position.copy(s.logo.position);
    const rs = sc * (1.04 + 0.4 * rip); s.ripple.scale.set(rs, rs, 1);
    s.ripple.material.opacity = reduced ? 0 : (1 - rip) * (1 - rip) * (1 - rip) * (0.08 + 0.14 * s.hoverV) * vis * Math.min(1, s.appear);
    s.shadow.material.opacity = 0.42 * Math.min(1, s.appear * 2) * (0.6 + 0.4 * s.dim);
    const shade = s.dim;
    s.faceMat.color.setScalar(shade); s.edgeA.color.copy(s.edgeABase).multiplyScalar(shade); s.edgeB.color.copy(s.edgeBBase).multiplyScalar(shade);
  }
  updateFly();

  if (state.hovered) {
    labelPos.copy(state.hovered.logo.position); labelPos.y += 0.38; labelPos.project(camera);
    const hl = $('hoverLabel');
    hl.style.left = ((labelPos.x + 1) / 2 * innerWidth) + 'px';
    hl.style.top = ((1 - labelPos.y) / 2 * innerHeight) + 'px';
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ================= Boot ================= */
async function boot() {
  try {
    await Promise.race([
      Promise.all([document.fonts.load('900 80px "Barlow Condensed"'), document.fonts.load('700 22px "DM Sans"')]),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) { /* fall back to system fonts */ }
  state.count = SAVED.count;
  await Promise.all(COUPONS.map(loadImg));
  // if the fonts were still loading when the cards were drawn, redraw them once they arrive
  const fontsReady = () => document.fonts.check('900 20px "Barlow Condensed"') && document.fonts.check('700 20px "DM Sans"');
  if (!fontsReady()) Promise.all([document.fonts.load('900 80px "Barlow Condensed"'), document.fonts.load('700 22px "DM Sans"')])
    .then(() => { if (fontsReady()) stacks.forEach(refreshStackArt); }).catch(() => {});
  buildStacks();
  buildSrNav();
  updateSubline();
  layout();
  stacks.forEach(s => s.cards.forEach(c => { c.userData.free = true; c.position.set(0, -50, -200); }));
  addEventListener('resize', () => { layout(); });
  requestAnimationFrame(frame);
  intro();
}
boot();
})();
</script>
